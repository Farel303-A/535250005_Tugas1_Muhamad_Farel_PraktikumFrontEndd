<!DOCTYPE html>
<html>

<head>
    <title>Penggunaan Operator Aritmatika</title>
</head>

<body>
    <h1>Penggunaan Operator Aritmatika</h1>
    <script>
        let x = 10;
        let y = 5;
        let addition = x + y;
        let subtraction = x - y;
        let multiplication = x * y;
        let division = x / y;
        let modulus = x % y;
        document.write("Hasil Penjumlahan: " + addition + "<br>");
        document.write("Hasil Pengurangan: " + subtraction + "<br>");
        document.write("Hasil Perkalian: " + multiplication + "<br>");
        document.write("Hasil Pembagian: " + division + "<br>");
        document.write("Hasil Modulus: " + modulus + "<br>");
        let num = 5;
        num++; // increment
        document.write("Hasil Setelah Increment: " + num + "<br>");
        let anotherNum = 8;
        anotherNum--; // decrement
        document.write("Hasil Setelah Decrement: " + anotherNum + "<br>");
    </script>
</body>

</html>
